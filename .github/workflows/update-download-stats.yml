name: Update download stats

on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - run: ruby scripts/update_download_stats.rb

      - name: Commit and rebuild the site
        run: |
          git diff --quiet -- _data/download_stats.json && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/download_stats.json
          git commit -m "Update download stats"
          git push

          # GITHUB_TOKEN 으로 푸시하면 Pages 빌드가 안 돌 수 있어서 직접 요청한다.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
