<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.tagline | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

{% assign on_downloads = false %}
{% if page.url == "/" or page.collection == "projects" %}
    {% assign on_downloads = true %}
{% endif %}

<aside class="sidebar">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="side-nav">
        <a
            href="{{ '/' | relative_url }}"
            {% if on_downloads %}class="active"{% endif %}
            {% if page.url == "/" %}aria-current="page"{% endif %}
        >앱 다운로드</a>
        {% comment %} Profile 메뉴는 당분간 숨김 (페이지는 /profile/ 에 그대로 있음)
        <a
            href="{{ '/profile/' | relative_url }}"
            {% if page.url == "/profile/" %}class="active" aria-current="page"{% endif %}
        >Profile</a>
        {% endcomment %}
    </nav>
</aside>

<div class="main">
    <main class="page">
        {{ content }}
    </main>

    <footer class="site-footer">
        <a href="https://github.com/Kyeongrok">github.com/Kyeongrok</a>
    </footer>
</div>

<script src="{{ '/assets/js/releases.js' | relative_url }}"></script>

</body>
</html>
