<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.tagline | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">
    {% unless page.url == "/" %}
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% endunless %}
</header>

<main class="page">
    {{ content }}
</main>

<footer class="site-footer">
    <a href="https://github.com/Kyeongrok">github.com/Kyeongrok</a>
</footer>

<script src="{{ '/assets/js/releases.js' | relative_url }}"></script>

</body>
</html>
